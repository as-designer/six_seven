name: Download MP4 and Compress to MKV

on:
  workflow_dispatch:

jobs:
  archive-video:
    runs-on: ubuntu-latest

    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download MP4 file
        run: |
          curl -L --fail \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o video.mp4 \
            "https://dave15.savenow.to/api/v2/download/fad92688b64d55f4ca2c04eaf4825e6f7d8d07c43129c5db"

      - name: Verify Download
        run: |
          ls -lh video.mp4
          file video.mp4

      - name: Compress to tiny
        run: |
          ffmpeg -i video.mp4 \
            -c:v libsvtav1 -crf 42 -preset 6 -svtav1-params tune=0 \
            -c:a libopus -b:a 32k -ac 1 \
            video.mkv
      - name: Upload 7z Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-archive-mkv
          path: video.mkv
          compression-level: 0
          retention-days: 7
          
