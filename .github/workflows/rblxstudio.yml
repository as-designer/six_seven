name: Deploy Standalone Roblox Studio EXE
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-standalone-exe:
    runs-on: windows-latest
    steps:
      - name: Extract Target Executable from Version Hash
        shell: powershell
        run: |
          # 1. Enforce secure network channel protocols
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
    
          # 2. Hardcoded to your specific version to bypass web scraping errors
          $version = "version-d0e8cfcd943d4ae2"
          echo "ROBLOX_VERSION=$version" >> $env:GITHUB_ENV
    
          # 3. Direct CDN link construction using the setup subdomain
          $url = "http://setup.roblox.com/$version-RobloxStudio.zip"
          Write-Output "Downloading from CDN: $url"
          Invoke-WebRequest -Uri $url -OutFile "source_package.zip" -MaximumRedirection 10
    
          # 4. Extract package tree and isolate the standalone binary
          Expand-Archive -Path "source_package.zip" -DestinationPath ".\UnpackedStudio"
          Copy-Item ".\UnpackedStudio\RobloxStudioBeta.exe" -Destination ".\RobloxStudioBeta.exe"
      - name: Publish Executable directly to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ROBLOX_VERSION }}
          name: Roblox Studio Standalone (${{ env.ROBLOX_VERSION }})
          body: |
            This release contains the raw **RobloxStudioBeta.exe** binary extracted directly from version hash: d0e8cfcd943d4ae2.
          files: RobloxStudioBeta.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
