name: Deploy Standalone Roblox Studio EXE
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-standalone-exe:
    runs-on: windows-latest
    steps:
      - name: Fetch Version and Extract Executable
        shell: powershell
        run: |
          # 1. Force modern security protocols for network calls
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          
          # 2. Corrected Target URL (Points to the active setup subdomain, NOT roblox.com)
          $version = Invoke-RestMethod -Uri "http://roblox.com" -MaximumRedirection 5
          Write-Output "Targeting stable version: $version"
          echo "ROBLOX_VERSION=$version" >> $env:GITHUB_ENV
          
          # 3. Pull down the full engine package from the CDN
          $url = "http://roblox.com/version-d0e8cfcd943d4ae2-RobloxStudio.zip"
          Write-Output "Downloading full source from: $url"
          Invoke-WebRequest -Uri $url -OutFile "source_package.zip" -MaximumRedirection 5
          
          # 4. Unpack the zip file locally on the GitHub runner
          Expand-Archive -Path "source_package.zip" -DestinationPath ".\UnpackedStudio"
          
          # 5. Extract only the main executable file to the root directory
          Copy-Item ".\UnpackedStudio\RobloxStudioBeta.exe" -Destination ".\RobloxStudioBeta.exe"

      - name: Publish Executable directly to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ROBLOX_VERSION }}
          name: Roblox Studio Standalone (${{ env.ROBLOX_VERSION }})
          body: |
            This release contains the raw **RobloxStudioBeta.exe** binary extracted directly from the deployment servers.
            
            * This allows you to completely bypass the 10MB online bootstrapper installer.
          files: RobloxStudioBeta.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
