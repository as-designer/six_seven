name: Build, Compress, and Release WSL Distro

on:
 workflow_dispatch: 

jobs:
  build-wsl:
    runs-on: windows-latest
    permissions:
      contents: write # Grants the workflow permission to create releases and upload files

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install WSL Core Architecture
        shell: powershell
        run: |
          # Install the underlying WSL platform without loading a distro yet
          wsl --install --no-distribution
          wsl --update

      - name: Download and Install Ubuntu
        shell: powershell
        run: |
          # Install official Ubuntu. --no-launch prevents the runner from hanging on username prompts.
          wsl --install --distribution Ubuntu --no-launch
          
          # Wait 10 seconds to ensure the system and virtual disk initialize completely
          Start-Sleep -Seconds 10

      - name: Pre-Configure and Clean Distro (Optional Customization)
        shell: powershell
        run: |
          # 1. Update the package lists inside the Ubuntu environment
          wsl -d Ubuntu apt-get update
          
          # 2. Install any tools you want pre-baked into your release (example: git and curl)
          wsl -d Ubuntu apt-get install -y git curl
          
          # 3. CRUCIAL: Clean cache files to shrink the final exported file size drastically
          wsl -d Ubuntu apt-get clean
          wsl -d Ubuntu rm -rf /var/lib/apt/lists/*

      - name: Export and Compress Distro into a Single File
        shell: powershell
        run: |
          # 1. Export the entire Ubuntu filesystem into one single raw .tar file
          wsl --export Ubuntu ./Ubuntu-Custom-WSL.tar
          
          # 2. Compress the huge single .tar file into a single optimized .zip archive
          Compress-Archive -Path ./Ubuntu-Custom-WSL.tar -DestinationPath ./Ubuntu-Custom-WSL.zip
          
          # 3. Clean up the large temporary .tar file to free up runner disk space
          Remove-Item ./Ubuntu-Custom-WSL.tar

      - name: Create GitHub Release and Upload Archive Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./Ubuntu-Custom-WSL.zip
          name: "WSL Ubuntu Release ${{ github.ref_name }}"
          body: |
            ### 🚀 Custom WSL Ubuntu Distribution Released!
            
            This release contains a pre-configured, single-file archive of Ubuntu for Windows Subsystem for Linux (WSL).
            
            #### 📦 How to Install This Release:
            1. **Download** the attached `Ubuntu-Custom-WSL.zip` file.
            2. **Extract** the zip file to get the `Ubuntu-Custom-WSL.tar` file.
            3. Open **PowerShell** as an Administrator.
            4. Choose or create a folder where you want to store your Linux environment (e.g., `C:\WSL\UbuntuCustom`).
            5. Run the following command to import and register the distro:
               ```powershell
               wsl --import CustomUbuntu C:\WSL\UbuntuCustom .\Ubuntu-Custom-WSL.tar
               ```
            6. Launch your new environment at any time by running:
               ```powershell
               wsl -d CustomUbuntu
               ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
