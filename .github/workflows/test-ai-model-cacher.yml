name: Test AI Model Cacher

on:
  workflow_dispatch:

jobs:
  run-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.14'
          cache: 'pip'
          
      - name: Cache the model
        uses: as-designer/ai-model-cacher@v0.1.0
        with:
          model-url: 'https://huggingface.co/Qwen/Qwen3-0.6B/resolve/main/model.safetensors'
          model-path: './models/model.safetensors'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install transformers safetensors acceleration torch
      - name: Execute Model via CLI
        run: |
          python3 -c "
          from transformers import pipeline
          pipe = pipeline('text-generation', model='./models', device_map='auto')
          res = pipe('Hello, GitHub Actions!', max_new_tokens=15)
          print('MODEL OUTPUT:', res)
