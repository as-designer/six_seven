name: Simple Anonymous Play Downloader

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'App Package ID (e.g., com.twitter.android)'
        required: true
        default: 'com.twitter.android'

jobs:
  download-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Tools & Download App
        run: |
          # The matlink/gplaycli project is a Python package distributed via pip
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev
          python3 -m pip install gplaycli

          # Fetch the direct URL of the latest compiled release .jar from GitHub
          JAR_URL=$(curl -s https://github.com/REAndroid/APKEditor | grep "browser_download_url.*\.jar" | cut -d '"' -f 4)
          
          # Download the actual file asset instead of the HTML page
          wget "$JAR_URL" -O APKEditor.jar
          
          # 3. Pull the app bundle from Play Store anonymously
          ./gplay-cli download "${{ github.event.inputs.package_id }}" -o ./bundle_dir

      - name: Convert Bundle to Standalone APK
        run: |
          # Unpack the downloaded .apks bundle and merge it into a single file
          mv ./bundle_dir/*.apks ./bundle_dir/bundle.zip
          unzip ./bundle_dir/bundle.zip -d ./extracted_splits
          java -jar APKEditor.jar m -i ./extracted_splits -o ./app-standalone.apk

      - name: Upload Single APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: play-store-apk
          path: ./app-standalone.apk
          retention-days: 1
