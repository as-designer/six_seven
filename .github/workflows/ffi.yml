name: Anonymous Standalone APK Downloader

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: 'Play Store Package ID (e.g., com.twitter.android)'
        required: true
        default: 'com.twitter.android'

jobs:
  download-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Download Compiled Tools Natively
        run: |
          # 1. Download the actual compiled Linux binary for gplay-cli (Bypasses HTML download bug)
          wget https://github.com/matlink/gplaycli/releases/download/3.27/gplaycli_3.27-1_all.deb -O gplay-cli
          chmod +x gplay-cli
          
          # 2. Query GitHub API to get the direct asset download URL for APKEditor.jar
          JAR_URL="https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar"
          
          # 3. Download the actual .jar asset file
          wget "$JAR_URL" -O APKEditor.jar

      - name: Fetch Bundle Anonymously
        run: |
          mkdir -p ./bundle_dir
          # Downloads the split app configurations natively via the public token dispenser
          ./gplay-cli download "${{ github.event.inputs.package_id }}" -o ./bundle_dir

      - name: Merge Split Modules into One Standalone APK
        run: |
          # 1. Unpack the structural zip/apks bundle file
          mv ./bundle_dir/*.apks ./bundle_dir/bundle.zip
          unzip ./bundle_dir/bundle.zip -d ./extracted_splits
          
          # 2. Run APKEditor to merge configuration modules into one normal .apk
          java -jar APKEditor.jar m -i ./extracted_splits -o ./app-standalone.apk

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: play-store-apk
          path: ./app-standalone.apk
          retention-days: 1
