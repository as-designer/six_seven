name: Download and Compress Free Fire India APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct HTTPS download URL for the APK from a source you trust"
        required: true
        type: string

permissions:
  contents: read

jobs:
  download-and-compress:
    runs-on: windows-latest
    steps:
      - name: Download APK
        shell: pwsh
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          if ($env:APK_URL -notmatch '^https://') {
            throw "Please provide a direct HTTPS download URL."
          }

          $out = Join-Path $env:RUNNER_TEMP "FreeFireIndia.apk"
          Invoke-WebRequest -Uri $env:APK_URL -OutFile $out

          if (!(Test-Path $out) -or (Get-Item $out).Length -eq 0) {
            throw "The APK download is empty or failed."
          }

          # Basic APK/ZIP signature check
          $stream = [System.IO.File]::OpenRead($out)
          try {
            $b1 = $stream.ReadByte()
            $b2 = $stream.ReadByte()
            if ($b1 -ne 0x50 -or $b2 -ne 0x4B) {
              throw "The downloaded file does not look like an APK/ZIP file."
            }
          }
          finally {
            $stream.Dispose()
          }

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) {
            throw "7-Zip was not installed successfully."
          }
          "SEVEN_ZIP=$sevenZip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compress APK with 7z Ultra (MX=9)
        shell: pwsh
        run: |
          $apk = Join-Path $env:RUNNER_TEMP "FreeFireIndia.apk"
          $archive = Join-Path $env:RUNNER_TEMP "FreeFireIndia.7z"
          & $env:SEVEN_ZIP a -t7z -mx=9 $archive $apk
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $archive)) {
            throw "7-Zip compression failed."
          }

      - name: Upload archive as a private Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireIndia-APK-7z
          path: ${{ runner.temp }}\FreeFireIndia.7z
          if-no-files-found: error
          retention-days: 3
