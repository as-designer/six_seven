name: Compress and Release Android Studio

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ZPAQ
        run: choco install zpaq -y

      - name: Fetch Latest Android Studio Windows URL
        id: fetch-url
        shell: powershell
        run: |
          $web = Invoke-WebRequest -Uri "https://developer.android.com/studio/index.html" -UseBasicParsing
          $link = ($web.Links | Where-Object { $_.href -like "*redirect_to_latest=true&platform=windows_installer*" }).href | Select-Object -First 1

          if (-not $link) {
            Write-Host "Fallback: Fetching direct installer link..."
            $web2 = Invoke-WebRequest -Uri "https://developer.android.com/studio" -UseBasicParsing
            $link = ($web2.Links | Where-Object { $_.href -like "*android-studio-*-windows.exe*" }).href | Select-Object -First 1
          }

          if (-not $link) {
            throw "Failed to locate Android Studio download URL."
          }

          Write-Host "Found URL: $link"
          "DOWNLOAD_URL=$link" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Android Studio
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "$env:DOWNLOAD_URL" -OutFile "android-studio.exe"

      - name: Compress with ZPAQ (Method 5 - Maximum)
        shell: cmd
        run: |
          zpaq add android-studio.zpaq android-studio.exe -m5

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'latest' }}
          name: "Android Studio ZPAQ Compressed"
          files: android-studio.zpaq
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
