name: Compress and Release Flutter Windows SDK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Flutter Windows SDK
        run: |
          $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.8-stable.zip"
          Write-Host "Downloading Flutter SDK..."
          Invoke-WebRequest -Uri $url -OutFile "flutter-windows.zip"
          Write-Host "Extracting archive..."
          Expand-Archive -Path "flutter-windows.zip" -DestinationPath "."
        shell: pwsh

      - name: Compress with 7-Zip (Ultra Mode)
        run: |
          Write-Host "Compressing flutter folder using 7z ultra..."
          7z a -t7z -mx=9 flutter-windows-sdk.7z .\flutter\
          Get-Item flutter-windows-sdk.7z | Select-Object Name, Length
        shell: pwsh

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: flutter-windows-sdk.7z
          tag_name: flutter-sdk-v1.0.${{ github.run_number }}
          name: Flutter Windows SDK (Compressed) v1.0.${{ github.run_number }}
          body: "Automated build containing the Flutter Windows SDK compressed with 7z -mx=9."
          draft: false
          prerelease: false
          
